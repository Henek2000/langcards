<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="A1 vocabulary flashcards for French and Russian">
  <title>Flashcards</title>
  <script>/* apply the saved theme before first paint (key langapp.theme.v1: dark | light | system) */
    try { var t = localStorage.getItem('langapp.theme.v1'), l = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
      if (l) { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name=theme-color]').setAttribute('content', '#f2eee6'); } } catch (e) {}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/lc-mark.svg" type="image/svg+xml">
  <link rel="icon" href="icons/lc-favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/lc-apple-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" aria-label="Back" hidden>‹</button>
    <h1 id="title">Flashcards</h1>
    <span class="spacer"></span>
    <button class="undo" id="undo" aria-label="Undo last card" title="Undo" data-test="undo" hidden>↶ Undo</button>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
