<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="A1 vocabulary flashcards for French and Russian">
  <title>Flashcards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" aria-label="Back" hidden>‹</button>
    <h1 id="title">Flashcards</h1>
    <span class="spacer"></span>
    <button class="undo" id="undo" aria-label="Undo last card" title="Undo" data-test="undo" hidden>↶ Undo</button>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
