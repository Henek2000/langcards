<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Langcards">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" aria-label="Back" hidden>‹</button>
    <h1 id="title">Langcards</h1>
    <span class="spacer"></span>
    <button class="undo" id="undo" aria-label="Undo last card" title="Undo" data-test="undo" hidden>↶ Undo</button>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
